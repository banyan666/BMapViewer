name: Publish Ultra cloud package

on:
  push:
    tags:
      - 'cloud-ultra-v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.repository == 'banyan666/BMapViewer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Update npm CLI
        run: npm install --global npm@latest
      - name: Install dependencies
        run: npm ci
      - name: Verify tag version
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const p = JSON.parse(fs.readFileSync('packages/cloud-ultra/package.json')); if (process.env.GITHUB_REF_NAME !== 'cloud-ultra-v' + p.version) throw new Error('Tag and package version do not match')"
      - name: Verify package contents
        run: npm run pack:cloud-ultra
      - name: Publish Ultra
        run: npm publish --workspace=@b-map-viewer/cloud-ultra --access public
